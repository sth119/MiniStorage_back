spring.application.name=ministorage-api

# 서버 포트 (프론트랑 겹치지 않게 8080 추천)
server.port=8080

#spring.datasource.url=jdbc:h2:file:./data/ministorage
#프로젝트 폴더 안에 data/ministorage.h2.db 파일로 데이터 영구 저장
#앱 재시작해도 데이터 유지됨

# H2 인메모리 DB 설정 (테스트용 최고, 앱 종료 시 데이터 사라짐)
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# H2 콘솔 활성화 (브라우저에서 DB 직접 확인 가능)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# DB 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/snaplist?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=9219
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate 설정
#spring.jpa.hibernate.ddl-auto=update
# 처음 실행할 때는 create로 해서 테이블 새로 만들기 추천
 spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Lombok 사용 시 (이미 @Data 썼으니 필요)
# annotationProcessorPaths 추가 안 해도 대부분 동작함

# Setting Redis
spring.redis.host=localhost
spring.redis.port=6379


# file upload setting
# window Ex: C:/ministorage-files/
# Mac Ex: /Users/username/ministorage-files/
# ${user.home}을 쓰면 사용자 홈 디렉토리를 자동으로 찾습니다.
#file.upload-dir=${user.home}/ministorage-files/
file.upload-dir=/Users/host/workspaces/REACT/Snaplist_Git/Snaplist_Front/fileSave

# 업로드 파일 크기 제한 (넉넉하게 설정)
spring.servlet.multipart.max-file-size=2000MB
spring.servlet.multipart.max-request-size=2000MB












